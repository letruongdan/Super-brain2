name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    name: gate (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - name: Run the gate
        run: uv run python scripts/gate.py --python ${{ matrix.python }}
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-receipt-${{ matrix.os }}-${{ matrix.python }}
          path: .gate/
          include-hidden-files: true
          if-no-files-found: error
