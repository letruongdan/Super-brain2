name: ci

on:
  push:
    branches:
      - main
      - sp1-increment3
      - thuc_hien_ke_hoach_sp1_dot3
      - "thuc_hien_ke_hoach_*"
  pull_request:
    branches:
      - main
      - sp1-increment3

env:
  T9_TEST_SEAL_R19_SHA256: ${{ vars.T9_TEST_SEAL_R19_SHA256 }}

jobs:
  gate:
    name: gate (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use reviewed LF bytes in this checkout
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --force --all

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"

      - name: Prepare physical temporary directory
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"]).resolve()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for var in ("TMPDIR", "TEMP", "TMP"):
                  output.write(f"{var}={temporary}\n")
          PY

      - name: Verify sealed test oracle before acceptance
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/seal-evidence"
          python .verification/test_lock.py check \
            --root . \
            --manifest .verification/task9-seal.json \
            --expected-digest "$T9_TEST_SEAL_R19_SHA256" \
            > "${RUNNER_TEMP}/seal-evidence/before.json" 2>&1

      - name: Sync dependencies for Python ${{ matrix.python }}
        shell: bash
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Run the gate
        shell: bash
        run: |
          ev="${{ runner.temp }}/gate-evidence"
          mkdir -p "$ev"
          out="${{ runner.temp }}/gate.stdout.log"
          err="${{ runner.temp }}/gate.stderr.log"
          set +e
          uv run --locked --python ${{ matrix.python }} python scripts/gate.py --python ${{ matrix.python }} --evidence-dir "$ev" > "$out" 2> "$err"
          code=$?
          [ -f "$out" ] && cat "$out"
          [ -f "$err" ] && cat "$err" >&2
          echo "$code" > "${{ runner.temp }}/gate.exit"
          exit $code

      - name: Benchmark
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/perf-evidence"
          uv run --locked --python ${{ matrix.python }} python -m tests.integration.test_kernel_performance --evidence-dir "${{ runner.temp }}/perf-evidence"

      - name: Verify sealed test oracle after acceptance
        if: always()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/seal-evidence"
          python .verification/test_lock.py check \
            --root . \
            --manifest .verification/task9-seal.json \
            --expected-digest "$T9_TEST_SEAL_R19_SHA256" \
            > "${RUNNER_TEMP}/seal-evidence/after.json" 2>&1

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-receipt-${{ matrix.os }}-${{ matrix.python }}
          path: .gate/
          if-no-files-found: ignore

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/gate-evidence
          if-no-files-found: ignore

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/perf-evidence
          if-no-files-found: ignore

      - name: Upload seal check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/seal-evidence
