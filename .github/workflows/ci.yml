name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    name: gate (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15-intel' || matrix.os }}
    env:
      T9_TEST_SEAL_R19_SHA256: ${{ vars.T9_TEST_SEAL_R19_SHA256 }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use reviewed LF bytes in this checkout and gate worktrees
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --all --force
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - name: Check reviewer seal before execution
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/seal-evidence"
          uv run --locked --python ${{ matrix.python }} python .verification/test_lock.py check --root . --manifest .verification/task9-seal.json --expected-digest "$T9_TEST_SEAL_R19_SHA256" > "$RUNNER_TEMP/seal-evidence/check-before.json" 2> "$RUNNER_TEMP/seal-evidence/check-before.stderr.log"
      - name: Prepare physical temporary directory
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"TMPDIR={temporary}\n")
          PY
      - name: Diagnose loopback socket-to-PID lookup (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: uv run --locked --python ${{ matrix.python }} python .github/diag/macos_socket_lookup.py
      - name: Trace observer lookups in failing native tests (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          PYTHONPATH=".github/diag:." uv run --locked --python ${{ matrix.python }} python -m pytest -q -s -p holders_trace -p no:cacheprovider             "tests/integration/test_kernel_native_receipt_contract.py::test_t9_r02_tls_close_before_worker_return_and_ready_port_mismatch"             "tests/integration/test_kernel_native_receipt_contract.py::test_two_principals_one_store_id" 2>&1 | grep -E "\[trace\]|passed|failed|Error" | head -80
      - name: Measure timed-wait overshoot (all OS)
        continue-on-error: true
        shell: bash
        run: uv run --locked --python ${{ matrix.python }} python .github/diag/timer_overshoot.py
      - name: Trace transport finish() after the cutoff (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: >-
          for i in 1 2 3; do PYTHONPATH=".github/diag:." uv run --locked --python ${{ matrix.python }} python -m pytest -q -s
          -p finish_trace -p no:cacheprovider
          "tests/integration/test_kernel_transport.py::TestTransportLifecycleAndRelease::test_shutdown_drains_with_one_grace_and_closes_transport"
          2>&1 | grep -E "trace|passed|failed|took"; done
      - name: Run the gate
        shell: bash
        run: |
          ev="${{ runner.temp }}/gate-evidence"
          mkdir -p "$ev"
          set +e
          uv run --locked --python ${{ matrix.python }} python scripts/gate.py --python ${{ matrix.python }} --evidence-dir "$ev" > "$ev/launcher.out" 2> "$ev/launcher.err"
          code=$?
          echo "$code" > "$ev/launcher.exit"
          cat "$ev/launcher.out"
          cat "$ev/launcher.err" >&2
          exit $code
      - name: Benchmark
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/perf-evidence"
          uv run --locked --python ${{ matrix.python }} python -m tests.integration.test_kernel_performance --evidence-dir "${{ runner.temp }}/perf-evidence"
      - name: Check reviewer seal after execution
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/seal-evidence"
          uv run --locked --python ${{ matrix.python }} python .verification/test_lock.py check --root . --manifest .verification/task9-seal.json --expected-digest "$T9_TEST_SEAL_R19_SHA256" > "$RUNNER_TEMP/seal-evidence/check-after.json" 2> "$RUNNER_TEMP/seal-evidence/check-after.stderr.log"
      - name: Upload seal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/seal-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-receipt-${{ matrix.os }}-${{ matrix.python }}
          path: .gate/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/gate-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/perf-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
